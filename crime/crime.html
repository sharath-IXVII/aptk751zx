  if(sh.body)body();if(sh.bed){box(S,1.2,.12,2.2,'#bfc2b8',2.2,.75,-1.2);box(S,1.1,.15,2.1,'#e6e6dc',2.2,.88,-1.2);box(S,1.0,.14,.4,'#f2f2ea',2.2,.98,-2.0);box(S,1.2,1.0,.1,'#4a2a18',2.2,1.0,-2.3)}if(sh.clue==='boot')boot();if(sh.fx&&sh.fx.includes('rain'))rain();if(sh.shadow)silhouette();

  cur=i;
}
const CAMS={

window.renderAt=(i,t,talk)=>{
  if(i!==cur)build(i);const sh=DATA.shots[i];
  for(const [id,c] of Object.entries(ctx.chars)){
    const ph=id.length;c.body.position.y=Math.sin(t*2+ph)*.02;c.head.rotation.y=Math.sin(t*.7+ph)*.15;
    const sp=talk&&sh.line.who===id;c.mouth.scale.y=sp?1+Math.abs(Math.sin(t*13)*Math.sin(t*5.1+1))*2.4:1;
    c.eyes.forEach(e=>e.scale.y=((t+ph)%3.2<.12)?.15:1);if(c.turn!==undefined){const k=Math.min(1,Math.max(0,(t-c.turn)/1.2));c.root.rotation.y=c.pry+(0-c.pry)*k*k*(3-2*k)}
    const a=c.act;c.arms[0].rotation.set(0,0,0);c.arms[1].rotation.set(0,0,0);c.legs.forEach(l=>l.rotation.x=0);c.hip.position.y=1.05;c.body.rotation.x=0;c.root.position.y=0;
    if(a==='smile'){c.mouth.scale.x=1.3;c.brows.forEach((b,k)=>b.rotation.z=k?-.18:.18)}
    if(a==='walk'){const w=Math.sin(t*6);c.legs[0].rotation.x=w*.5;c.legs[1].rotation.x=-w*.5;c.arms[0].rotation.x=-w*.4;c.arms[1].rotation.x=w*.4;
      if(sh.set==='stairs'){c.root.position.set(0,t*.3+.15,-t*.55);c.root.rotation.y=Math.PI}else{c.root.position.z=c.pz+t*.3}}
    if(a==='lie'){c.root.rotation.set(-Math.PI/2,0,0);c.root.position.y=1.0}
    if(a==='give'){c.arms[1].rotation.x=-1.3}
    if(a==='tuck'){c.arms[0].rotation.x=-1.1;c.arms[1].rotation.x=-1.1;c.body.rotation.x=.35}
    if(a==='cry'){c.arms[0].rotation.set(-2.5,0,.5);c.arms[1].rotation.set(-2.5,0,-.5);c.head.rotation.x=.25;c.body.position.y+=Math.sin(t*9)*.015}
    if(a==='cuffed'){c.arms[0].rotation.set(.35,0,.15);c.arms[1].rotation.set(.35,0,-.15);c.head.rotation.x=.15}
    if(a==='point'){c.arms[1].rotation.x=-1.55}
    if(a==='sick'){c.root.rotation.set(-Math.PI/2,0,0);c.root.position.y=1.0;c.eyes.forEach(e=>e.scale.y=.25);c.head.rotation.y=Math.sin(t*1.3)*.25}
    if(a==='peek'){c.root.rotation.set(-Math.PI/2,0,0);c.root.position.y=1.0;c.eyes.forEach((e,k)=>e.scale.y=k?1:.12)}
    if(a==='sleep'){c.root.rotation.set(-Math.PI/2,0,0);c.root.position.y=1.0;c.eyes.forEach(e=>e.scale.y=.12)}

  }
  if(ctx.rain){const p=ctx.rain.geometry.attributes.position;for(let k=0;k<p.count;k++){let y=p.getY(k)-0.6;if(y<0)y+=25;p.setY(k,y)}p.needsUpdate=true}

  if(ctx.beam)ctx.beam.rotation.y=t*1.2;

  const ln=sh.fx&&sh.fx.includes('lightning')&&((t>1.2&&t<1.32)||(t>1.45&&t<1.55));
  S.background.set(ln?'#c8d4ff':({street:'#0e1018',forest:'#0b120e',prison:'#0a0a0c',home:'#120c08',court:'#14100c',asylum:'#08090a',grave:'#0d1018',ward:'#0a0c0c',shore:'#141a2e',stairs:'#0d0d12',room:'#0b0b10',dock:'#121828'})[sh.set]);ctx.moon.intensity=ln?7:({room:.9,home:.6,court:.8,asylum:.7,prison:.6,street:1.2,forest:2.4})[sh.set]||1.8;
  if(ctx.bigLamp)ctx.bigLamp.intensity=t>1.8?120:0;

  ttl.style.display=sh.title&&t<3.2?'block':'none';if(sh.title)ttl.textContent=sh.title;
  const cp=(sh.caps||[]).find(c=>t>=c[0]&&t<c[1]);cap.style.display=cp&&!sh.card&&!sh.intro?'block':'none';if(cp)capt.textContent=cp[2];
  intro.style.display=sh.intro?'flex':'none';if(sh.intro){in1.textContent=sh.intro.name;in1.style.fontSize=(sh.intro.name.length>20?60:sh.intro.name.length>12?80:108)+'px';in3.style.fontSize=(sh.intro.crime.length>18?54:74)+'px';in2.textContent=sh.intro.years;in3.textContent=sh.intro.crime;in4.textContent=sh.intro.part}
  const [p,l]=CAMS[sh.cam](t);cam.position.set(...p);ctx.fill.position.set(p[0]*.6,p[1]+1,p[2]*.6);cam.lookAt(...l);
  R.render(S,cam);
};
