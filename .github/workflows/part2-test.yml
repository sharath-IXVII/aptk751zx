name: Part 2 - Trending topic + script test

on:
  push:
    branches: [debug-part3]   # maintainer debugging
  workflow_dispatch:
    inputs:
      make_video:
        description: "Also make the NotebookLM video (~30 min)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: NotebookLM login
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          NOTEBOOKLM_MASTER_TOKEN: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN }}
        run: bash tools/notebooklm_auth.sh
      - name: Write script (and video)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          VIDEO_LANGUAGE: en
        run: python part2_test.py ${{ inputs.make_video && '--video' || '' }}
      - name: Save script to the part3-debug branch
        if: always()
        run: |
          mkdir -p /tmp/dbg && cp output/script.json /tmp/dbg/ 2>/dev/null || true
          cd /tmp/dbg && git init -q && git checkout -q -b part3-debug
          git config user.name yt-bot && git config user.email yt-bot@users.noreply.github.com
          git add -A && git commit -qm "Part 2 script" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" part3-debug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part2-output
          path: output/
          retention-days: 1       # test files are deleted after 1 day
          if-no-files-found: ignore
