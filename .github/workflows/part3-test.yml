name: Part 3 - Watermark removal test

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Test video to use"
        type: choice
        options:
          - last-daily-video   # the raw NotebookLM video from the latest Daily video run
          - new-notebooklm-video
          - sample
        default: last-daily-video

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: NotebookLM login
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          NOTEBOOKLM_MASTER_TOKEN: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN }}
        run: bash tools/notebooklm_auth.sh
      - name: Get a test video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.source }}" = "last-daily-video" ]; then
            run_id=$(gh run list --workflow daily.yml --limit 20 --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion=="failure")][0].databaseId')
            echo "Using video from Daily video run $run_id"
            if gh run download "$run_id" -n video-output -D /tmp/last 2>/dev/null && [ -f /tmp/last/video_raw.mp4 ]; then
              cp /tmp/last/video_raw.mp4 /tmp/input.mp4
            else
              echo "No saved daily video (successful runs no longer keep videos) - using a sample"
              ffmpeg -v error -f lavfi -i testsrc=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 \
                -t 40 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/input.mp4
            fi
          elif [ "${{ inputs.source }}" = "new-notebooklm-video" ]; then
            python part1_test.py && cp output/part1_test.mp4 /tmp/input.mp4
          else
            ffmpeg -v error -f lavfi -i testsrc=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 \
              -t 40 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/input.mp4
          fi
      - run: |
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size -of compact /tmp/input.mp4 | tee input_info.txt
          python part3_test.py /tmp/input.mp4 2>&1 | tee part3.log
          # Still frames before/after (full frame + bottom-right corner) to check the logo.
          mkdir -p frames
          for f in /tmp/input.mp4 output/video_clean.mp4 output/video_final.mp4; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .mp4)
            for t in 20 90; do
              ffmpeg -v error -y -ss $t -i "$f" -frames:v 1 "frames/${n}_${t}s.jpg" || true
              ffmpeg -v error -y -ss $t -i "$f" -frames:v 1 -vf "crop=iw/3:ih/4:iw*2/3:ih*3/4" "frames/${n}_${t}s_corner.jpg" || true
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part3-output
          path: output/
          retention-days: 1       # test files are deleted after 1 day
          if-no-files-found: ignore
      - name: Save site screenshots to the part3-debug branch
        if: always()
        run: |
          mkdir -p /tmp/dbg && cp -r output/site_screens/. /tmp/dbg/ 2>/dev/null || true
          cp input_info.txt part3.log /tmp/dbg/ 2>/dev/null || true
          cp -r frames /tmp/dbg/ 2>/dev/null || true
          git config user.name "yt-bot"
          git config user.email "yt-bot@users.noreply.github.com"
          git checkout --orphan part3-debug
          git rm -rf --cached . > /dev/null
          git clean -fdq
          rm -rf ./*
          cp -r /tmp/dbg/. . 2>/dev/null || true
          git add -A
          git commit -m "Part 3 debug screenshots" || true
          git push -f origin part3-debug
