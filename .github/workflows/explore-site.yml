name: Explore watermark site

on:
  workflow_dispatch:

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/explore_site.py https://notebooklmremover.com/en
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-explore
          path: output/site/
