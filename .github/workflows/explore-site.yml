name: Explore watermark site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/explore_site.py https://notebooklmremover.com/en
      - name: Make a 1280x720 sample video
        run: |
          sudo apt-get install -y ffmpeg > /dev/null
          ffmpeg -v error -f lavfi -i testsrc=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 \
            -t 40 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/sample.mp4
      - name: Try the full upload/download flow
        continue-on-error: true
        run: python tools/explore_site_flow.py /tmp/sample.mp4
      - name: Save findings to the site-explore branch
        if: always()
        run: |
          mkdir -p /tmp/site && cp -r output/site/. /tmp/site/
          git config user.name "yt-bot"
          git config user.email "yt-bot@users.noreply.github.com"
          git checkout --orphan site-explore
          git rm -rf --cached . > /dev/null
          rm -rf ./* .github
          cp -r /tmp/site/. .
          git add -A
          git commit -m "Site exploration results"
          git push -f origin site-explore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-explore
          path: output/site/
