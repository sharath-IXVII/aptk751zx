name: Daily video

on:
  # Every 6 hours (05:47, 11:47, 17:47, 23:47 India time); each run makes and uploads one
  # video (set the VIDEOS_PER_DAY variable to limit it). To stop, put a # in front of the next two lines.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Make a video even if the VIDEOS_PER_DAY limit is reached"
        type: boolean
        default: false

concurrency:
  group: daily-video        # never run two at once
  cancel-in-progress: false

permissions:
  contents: write           # to save state/ (history, resume info) back to the repo

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      # Quick check first: if the last NotebookLM video started less than 5 hours ago and
      # nothing is waiting to be finished, stop in seconds (NotebookLM allows 1 video per 5 h).
      - name: Anything to do?
        id: check
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, pathlib
          f = pathlib.Path("state/current.json")
          state = json.loads(f.read_text()) if f.exists() else {}
          last = state.get("notebooklm_started_at")
          recent = last and dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(last) < dt.timedelta(hours=5)
          print("skip=" + ("true" if recent and not state.get("job") else "false"))
          PY
          cat "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true' || inputs.force
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
        if: steps.check.outputs.skip != 'true' || inputs.force
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
        if: steps.check.outputs.skip != 'true' || inputs.force
      - name: NotebookLM login
        if: steps.check.outputs.skip != 'true' || inputs.force
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          NOTEBOOKLM_MASTER_TOKEN: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN }}
        run: bash tools/notebooklm_auth.sh
      - name: Make and upload video
        if: steps.check.outputs.skip != 'true' || inputs.force
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_WRITER_MODEL: ${{ secrets.NVIDIA_WRITER_MODEL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          YT_PUBLISH_TIME: ${{ vars.YT_PUBLISH_TIME }}
          VIDEOS_PER_DAY: ${{ vars.VIDEOS_PER_DAY }}
          YT_CATEGORY: ${{ vars.YT_CATEGORY }}
          WATERMARK_BOX: ${{ vars.WATERMARK_BOX }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          WATERMARK_SITE: ${{ vars.WATERMARK_SITE }}
          THUMBNAIL_AT: ${{ vars.THUMBNAIL_AT }}
          VIDEO_LANGUAGE: en
        run: python run.py ${{ inputs.force && '--force' || '' }}
      - name: Save state
        if: always() && (steps.check.outputs.skip != 'true' || inputs.force)
        run: |
          git config user.name "yt-bot"
          git config user.email "yt-bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || (git commit -m "Update pipeline state [skip ci]" && git push)
      - uses: actions/upload-artifact@v4
        if: always() && (steps.check.outputs.skip != 'true' || inputs.force)
        with:
          name: video-output
          path: output/
          if-no-files-found: ignore
          retention-days: 3       # run files are deleted automatically after 3 days
